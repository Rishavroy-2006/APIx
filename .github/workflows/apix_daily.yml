name: APIx Daily Scrapers

on:
  schedule:
    # GitHub Cron runs in UTC. 
    # 04:30 UTC = 10:00 AM IST
    - cron: '30 4 * * *'
    # 12:30 UTC = 06:00 PM IST
    - cron: '30 12 * * *'
    # 17:30 UTC = 11:00 PM IST
    - cron: '30 17 * * *'
  
  # Allows you to trigger this workflow manually from the GitHub Actions tab
  workflow_dispatch:

jobs:
  scrape_and_commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to commit the CSVs back to the repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install undetected-chromedriver pandas selenium

      - name: Install Xvfb (Virtual Display)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          # Xvfb is required because undetected-chromedriver needs a "real" display to run,
          # and Linux servers don't have monitors attached.

      - name: Run Scrapers (Intelligent Chunking)
        run: |
          # Check the current UTC hour to determine which chunk to run
          HOUR=$(date -u +"%H")
          
          echo "Current UTC Hour is: $HOUR"
          
          # We use ranges (-ge, -lt) because GitHub Actions crons are sometimes delayed by 15-30 mins
          if [ "$HOUR" -ge 4 ] && [ "$HOUR" -lt 10 ]; then
              echo "🌅 MORNING RUN: SpiceJet (All) + IndiGo (T+1, T+7)"
              xvfb-run python3 spicejet/spicejet_scraper.py
              xvfb-run python3 indigo/indigo_scraper_uc.py --windows 1,7
              
          elif [ "$HOUR" -ge 12 ] && [ "$HOUR" -lt 16 ]; then
              echo "🌇 EVENING RUN: IndiGo (T+15, T+30)"
              xvfb-run python3 indigo/indigo_scraper_uc.py --windows 15,30
              
          elif [ "$HOUR" -ge 17 ] && [ "$HOUR" -lt 23 ]; then
              echo "🌙 NIGHT RUN: IndiGo (T+45)"
              xvfb-run python3 indigo/indigo_scraper_uc.py --windows 45
              
          else
              echo "⚙️ MANUAL/FALLBACK RUN: Running everything!"
              xvfb-run python3 spicejet/spicejet_scraper.py
              xvfb-run python3 indigo/indigo_scraper_uc.py
          fi

      - name: Commit and Push CSVs
        run: |
          git config --global user.name "APIx Github Bot"
          git config --global user.email "bot@apix.local"
          
          # Add the new folders/files created in apix_data/raw/
          git add apix_data/raw/
          
          # Commit only if there are changes
          git diff --quiet && git diff --staged --quiet || git commit -m "Automated CPI Scrape: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
