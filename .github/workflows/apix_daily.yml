name: Udaan Metrics Daily Scrapers

on:
  schedule:
    # GitHub Cron runs in UTC.
    # 01:30 UTC = 07:00 AM IST (Primary Morning Run)
    - cron: '30 1 * * *'
    # 04:30 UTC = 10:00 AM IST (Fallback Run 3 hours later)
    - cron: '30 4 * * *'

    # 12:30 UTC = 06:00 PM IST (Primary Evening Run)
    - cron: '30 12 * * *'
    # 17:30 UTC = 11:00 PM IST (End of day catch-up)
    - cron: '30 17 * * *'

  # Allows you to trigger this workflow manually from the GitHub Actions tab
  workflow_dispatch:

# Ensure only one scraper job runs at a time
concurrency:
  group: apix-scraper-group
  cancel-in-progress: false

jobs:
  scrape_and_commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to commit the CSVs back to the repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            undetected-chromedriver \
            seleniumbase \
            selenium \
            pandas \
            beautifulsoup4 \
            lxml

      - name: Install Xvfb (Virtual Display)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          # Xvfb is required because undetected-chromedriver needs a "real" display to run,
          # and Linux servers don't have monitors attached.

      - name: Run Scrapers (Smart Orchestrator)
        run: |
          python3 smart_orchestrator.py

      - name: Compute Daily Index
        run: |
          # Compile today's raw CSVs into the master index
          python3 compute_daily_index.py

      - name: Commit and Push CSVs
        if: always()
        run: |
          git config --global user.name "Udaan Metrics Github Bot"
          git config --global user.email "bot@apix.local"

          # Add all outputs: raw CSVs, index, and airport filter log
          git add udaan_data/raw/
          git add udaan_data/index/
          git add compute_daily_index.py
          git add discarded_routes.log || true   # may not exist if no alternates were seen

          # Commit only if there are changes
          git diff --quiet && git diff --staged --quiet || git commit -m "Automated CPI Scrape & Index: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
